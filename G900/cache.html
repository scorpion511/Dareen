    .fire-red {
        color: white; font-size: 28px; padding: 5px 20px;

    .super-glow {

        -webkit-animation: rainbow-glow 3s linear infinite;
    }

    #progress { font-weight: bold; text-shadow: 4px 4px 4px black; font-size: 25px; color: white; }

    @keyframes firefrost-flicker {
        0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff8000, 0 0 30px #00ffff; transform: scale(1); }
        100% { text-shadow: 0 0 15px #ff4e00, 0 0 30px #ffea00, 0 0 45px #00ffff, 0 0 60px #ffffff; transform: scale(1.02); }
    }

    @-webkit-keyframes red-flicker {
        0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; -webkit-transform: scale(1); }
        100% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff4e00; -webkit-transform: scale(1.05); }
    }

    @keyframes hue-cycle { 0% { -webkit-filter: hue-rotate(0deg); } 100% { -webkit-filter: hue-rotate(360deg); } }
    @keyframes rainbow-glow { 0% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; filter: hue-rotate(0deg); } 100% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; filter: hue-rotate(360deg); } }

<script>
    history.replaceState(null,null,'index.html');

    history.go(-histlength);

    function DLProgress(e){
        Percent=(Math.round(e.loaded / e.total * 100));
        setTimeout(function(){
            window.progress.innerHTML="Installing Offline Cache: " + Percent + "%";
        },500);
    }

    function DisplayCacheProgress(){
        setTimeout(function(){window.progress.innerHTML="Page Cached Successfully!!";},1500);
        setTimeout(function(){window.progress.innerHTML="Reopen the Page !!";},3500);
    }

    window.applicationCache.addEventListener("progress",DLProgress,false);
    window.applicationCache.oncached=function(e){DisplayCacheProgress();};
    window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>
