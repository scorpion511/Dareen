<html manifest="Cache.manifest">
<head>
<title>Scorpio Host Auto Exploit - 9.00 fw</title>
<style>
    html, body {
        background: url("bg.jpg") #1A1920 no-repeat center center fixed; 
        background-size: cover;
        margin: auto;
        font-family: sans-serif;
        font-size: 20px;
        font-weight: lighter;
        text-align: center;
        color: #FFFFFF;
        overflow: hidden;
    }

    /* Blackfire Title */
    .blackfire {
        font-size: 50px;
        font-weight: 900;
        color: #111; 
        text-transform: uppercase;
        margin-top: 20px;
        letter-spacing: 4px;
        text-shadow: 0 0 10px #ff0000, 0 0 20px #000, 0 0 30px #000, 0 0 40px #ff0000;
        animation: blackfire-flicker 2s infinite alternate;
        -webkit-animation: blackfire-flicker 2s infinite alternate;
    }

    @keyframes blackfire-flicker {
        0%, 100% { text-shadow: 0 0 10px #ff0000, 0 0 20px #000, 0 0 30px #000, 0 0 40px #ff0000; opacity: 1; }
        50% { text-shadow: 0 0 15px #800000, 0 0 25px #000, 0 0 35px #000, 0 0 55px #800000; -webkit-transform: scale(1.01); }
    }

    /* Super Glowing Rainbow Names */
    .super-glow {
        font-size: 35px;
        font-weight: bold;
        color: white;
        animation: rainbow-glow 3s linear infinite;
        -webkit-animation: rainbow-glow 3s linear infinite;
    }

    @keyframes rainbow-glow {
        0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; filter: hue-rotate(0deg); }
        100% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; filter: hue-rotate(360deg); }
    }

    #progress {
        font-weight: bold;
        text-shadow: 4px 4px 4px black;
        font-size: 25px;
        color: white;
    }

    .content {
        width: 90%;
        height: 15%;
        margin-left: 3.5%;
        background: rgba(0, 0, 0, 0.7); 
        border-radius: 30px;
        padding: 20px;
        position: absolute;
        bottom: 10px;
        line-height: 12px;
    }

    .yellow { color: yellow; }

    .hue {
        color: white;
        padding: 10px;
        border-radius: 10px;
        background: rgba(255, 255, 0, 0.4);
        box-shadow: 0px 0px 50px yellow;
        animation: hue-cycle 5s linear infinite;
        -webkit-animation: hue-cycle 5s linear infinite;
    }

    @keyframes hue-cycle {
        0% { -webkit-filter: hue-rotate(0deg); }
        100% { -webkit-filter: hue-rotate(360deg); }
    }
</style>
<meta charset="utf-8">
</head>
<body>
<script>
    history.replaceState(null,null,'index.html');
    var histlength=history.length;
    history.go(-histlength);

    function DLProgress(e){
        Percent=(Math.round(e.loaded / e.total * 100));
        setTimeout(function(){
            window.progress.innerHTML="Installing Offline Cache: " + Percent + "%";
        },500);
    }

    function DisplayCacheProgress(){
        setTimeout(function(){window.progress.innerHTML="Page Cached Successfully!!";},1500);
        setTimeout(function(){window.progress.innerHTML="Reopen the Page !!";},3500);
    }

    window.applicationCache.addEventListener("progress",DLProgress,false);
    window.applicationCache.oncached=function(e){DisplayCacheProgress();};
    window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>

<div class="blackfire">Welcome to Scorpion Hack</div>

        <br><br><br><br>
        <span class="yellow" style="text-shadow: 4px 4px 4px black;">Super Special Thanks To :</span>&nbsp;&nbsp; 
        <span class="super-glow">Dareen & Omar & jojo</span>
    </div>
</div>
</body>
</html>
