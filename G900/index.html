    @keyframes flicker {
        0%, 100% { opacity: 1; transform: scale(1); }

    }

    @keyframes hue-cycle {
        0% { -webkit-filter: hue-rotate(0deg); }

    }

    @keyframes rainbow-glow {
        0% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; filter: hue-rotate(0deg); }
